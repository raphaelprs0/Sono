[package]
name = "sono"
version = "2.5.11"
description = "Sono, la file musicale collaborative pour vos soirées."
authors = ["Sono"]
edition = "2021"

[[bin]]
name = "sono"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "process", "sync", "io-util", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
regex = "1"
if-addrs = "0.13"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
brotli = "7"
flate2 = "1"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
open = "5"
urlencoding = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
